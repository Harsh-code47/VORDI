<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VORDI — Microphone Permission</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --accent: #2d8cf0;
      --accent-hover: #3395ff;
      --green: #3fb950;
      --red: #f85149;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --radius: 12px;
    }

    [data-theme="light"] {
      --bg: #ffffff;
      --surface: #f6f8fa;
      --border: #d0d7de;
      --accent: #0969da;
      --accent-hover: #0a7fcb;
      --green: #1a7f37;
      --red: #cf222e;
      --text: #1f2328;
      --text-muted: #636c76;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      font-size: 14px;
      line-height: 1.5;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px 36px;
      max-width: 460px;
      text-align: center;
      box-shadow: 0 12px 36px rgba(0,0,0,0.35);
    }
    .icon-wrapper {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(45, 140, 240, 0.12);
      border: 1px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      color: var(--accent);
    }
    .icon-wrapper svg {
      width: 28px;
      height: 28px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--text);
      letter-spacing: -0.01em;
    }
    p {
      color: var(--text-muted);
      font-size: 13.5px;
      line-height: 1.6;
      margin-bottom: 26px;
    }
    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s, transform 0.15s;
    }
    .btn:hover {
      background: var(--accent-hover);
    }
    .btn svg {
      width: 16px;
      height: 16px;
    }
    .status {
      margin-top: 18px;
      font-size: 13px;
      font-weight: 500;
    }
    .status.success { color: var(--green); }
    .status.error { color: var(--red); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrapper">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </div>
    <h1>Enable Microphone for VORDI</h1>
    <p>VORDI uses browser microphone access to recognize voice commands and detect the wake word <strong>"Hey VORDI"</strong> hands-free.</p>
    <button class="btn" id="grant-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
      <span>Allow Microphone Access</span>
    </button>
    <div class="status" id="status-msg"></div>
  </div>
  <script>
    const saved = localStorage.getItem('vordi-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', saved);
  </script>
  <script src="permission.js"></script>
</body>
</html>
