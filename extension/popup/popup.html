<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VORDI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">

    <!-- Header -->
    <header class="header">
      <div class="logo">
        <div class="logo-mark">
          <!-- Waveform icon mark -->
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="1"  y="8"  width="2.5" height="6"  rx="1.25" fill="var(--accent)" opacity="0.6"/>
            <rect x="5"  y="5"  width="2.5" height="12" rx="1.25" fill="var(--accent)" opacity="0.8"/>
            <rect x="9"  y="2"  width="2.5" height="18" rx="1.25" fill="var(--accent)"/>
            <rect x="13" y="5"  width="2.5" height="12" rx="1.25" fill="var(--accent)" opacity="0.8"/>
            <rect x="17" y="8"  width="2.5" height="6"  rx="1.25" fill="var(--accent)" opacity="0.6"/>
          </svg>
        </div>
        <span class="logo-text">VORDI</span>
      </div>

      <div class="header-controls">
        <!-- Theme toggle -->
        <button class="btn-theme" id="btn-theme" title="Toggle theme" aria-label="Toggle light/dark theme">
          <!-- Moon icon (shown in dark mode) -->
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <!-- Sun icon (shown in light mode) -->
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1"  x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22"  y1="4.22"  x2="5.64"  y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1"  y1="12" x2="3"  y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22"  y1="19.78" x2="5.64"  y2="18.36"/>
            <line x1="18.36" y1="5.64"  x2="19.78" y2="4.22"/>
          </svg>
        </button>

        <!-- Enable toggle -->
        <label class="toggle-switch" title="Enable / Disable VORDI">
          <input type="checkbox" id="enable-toggle">
          <span class="toggle-track"></span>
        </label>
      </div>
    </header>

    <!-- Permission alert banner (hidden by default) -->
    <div class="permission-banner" id="permission-banner" style="display: none;">
      <span>Microphone permission required</span>
      <button id="grant-perm-link" class="btn-perm">Enable Mic</button>
    </div>

    <!-- Voice Hub Launcher -->
    <div class="hub-launcher">
      <button id="btn-open-hub" class="btn-hub">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8"  y1="23" x2="16" y2="23"/>
        </svg>
        Open Hands-Free Voice Hub
      </button>
    </div>

    <!-- Status -->
    <div class="status-bar" id="status-bar">
      <span class="status-dot" id="status-dot"></span>
      <span class="status-text" id="status-text">Ready</span>
    </div>

    <!-- Mic button -->
    <div class="mic-section">
      <button class="mic-btn" id="mic-btn" title="Click to give a command">
        <svg class="mic-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="9" y="1" width="6" height="13" rx="3" fill="currentColor"/>
          <path d="M5 10a7 7 0 0 0 14 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="12" y1="17" x2="12" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="9"  y1="21" x2="15" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="mic-label" id="mic-label">Tap to Speak</span>
      </button>

      <div class="live-transcript" id="live-transcript" style="display: none;"></div>
      <p class="wake-hint">or say <strong>"Hey VORDI"</strong> on web pages (Alt+V)</p>
    </div>

    <!-- Quick Test Command Input -->
    <section class="test-input-section">
      <form id="popup-cmd-form" class="popup-cmd-form">
        <input type="text" id="popup-cmd-input" placeholder="Type a command to test..." autocomplete="off" />
        <button type="submit" id="popup-cmd-btn" class="popup-run-btn">Run</button>
      </form>
    </section>

    <!-- Quick hints / Test chips -->
    <section class="hints-section">
      <h3 class="section-title">Quick Commands</h3>
      <div class="hints-grid">
        <div class="hint-chip" data-cmd="open new tab">New tab</div>
        <div class="hint-chip" data-cmd="scroll down">Scroll down</div>
        <div class="hint-chip" data-cmd="scroll up">Scroll up</div>
        <div class="hint-chip" data-cmd="search for quantum computing">Search</div>
        <div class="hint-chip" data-cmd="go to github.com">GitHub</div>
        <div class="hint-chip" data-cmd="bookmark this page">Bookmark</div>
      </div>
    </section>

    <!-- Recent commands -->
    <section class="recent-section">
      <h3 class="section-title">Recent</h3>
      <ul class="recent-list" id="recent-list">
        <li class="recent-empty">No commands yet</li>
      </ul>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <a href="#" id="open-sidepanel" class="footer-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <line x1="15" y1="3" x2="15" y2="21"/>
        </svg>
        Side Panel
      </a>
      <span class="footer-sep">|</span>
      <a href="#" id="open-options" class="footer-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        Settings
      </a>
      <span class="footer-sep">|</span>
      <a href="#" id="open-help" class="footer-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        Help
      </a>
    </footer>

  </div>
  <script src="popup.js"></script>
</body>
</html>
